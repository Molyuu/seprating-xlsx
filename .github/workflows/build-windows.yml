name: Build Windows exe
on:
  push:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run pyinstaller --onefile --windowed --name ExcelSplitter --collect-data tzdata app.py
      - uses: actions/upload-artifact@v4
        with:
          name: ExcelSplitter-windows
          path: dist/ExcelSplitter.exe
      - name: Attach exe to GitHub release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/ExcelSplitter.exe --clobber
